// Module: app
// The ONLY module that applies the spring-boot plugin.
// Produces the single executable fat JAR for the whole platform.
// Contains only: main application class + merged config files.

plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common')
    implementation project(':generic-services')
    implementation project(':onboarding')
    implementation project(':registration-authority')
    implementation project(':organization')
    implementation project(':onboarding-transaction-handler')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    implementation 'org.springframework.boot:spring-boot-starter-undertow'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.glassfish:jakarta.el:4.0.2'
}

bootJar {
    archiveFileName = 'dtt-platform.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    enabled = false
}
