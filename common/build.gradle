// Module: common
// Shared infrastructure: HTTP, i18n, Jasypt, Kafka base config.

plugins {
    id 'java'
    id 'io.spring.dependency-management'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.2"
    }
}


bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''  // Default JAR for libraries
}



configurations.all {
    resolutionStrategy {
        force 'org.apache.httpcomponents.client5:httpclient5:5.3.1'
    }
}

dependencies {
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'

    implementation fileTree('libs/DAESLogIntegrity.jar')
    //implementation files('libs/DAESLogIntegrity.jar')

    //implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'
    implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'
    implementation 'org.springframework.vault:spring-vault-core'

    runtimeOnly 'org.postgresql:postgresql'
}