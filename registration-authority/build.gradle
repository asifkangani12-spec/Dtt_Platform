// Module: registration-authority
// Responsibility: PKI certificate lifecycle, RA service,
//                 subscriber RA data, Kafka, Sentry monitoring.

tasks.matching { it.name == 'bootJar' }.configureEach { enabled = false }
jar     { enabled = true  }

dependencies {
    implementation project(':common')

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    //implementation fileTree('libs/DAESLogIntegrity.jar')
    //implementation files('libs/DAESLogIntegrity.jar')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    implementation 'org.springframework.boot:spring-boot-starter-undertow'

    implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'
    implementation 'org.springframework.vault:spring-vault-core'
    implementation 'org.springframework.kafka:spring-kafka'

    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'org.hibernate.orm:hibernate-core:6.4.4.Final'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.3'
    implementation 'org.imgscalr:imgscalr-lib:4.2'
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:7.16.0'
//    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.3'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.6'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.18.6'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.18.6'

    constraints {
        implementation 'org.springframework.boot:spring-boot:3.3.11'
        implementation 'org.springframework:spring-core:6.2.17'
        implementation 'org.springframework:spring-webmvc:6.2.17'
        implementation 'org.springframework:spring-web:6.2.17'
        implementation 'org.springframework:spring-beans:6.2.17'
        implementation 'org.springframework:spring-expression:6.2.17'
        implementation 'org.springframework:spring-context:6.2.17'
        implementation 'ch.qos.logback:logback-core:1.5.25'
        implementation 'ch.qos.logback:logback-classic:1.5.25'
      }
}
